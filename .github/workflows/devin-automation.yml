name: Devin Automation Service Tests

on:
  push:
    branches:
      - "master"
    paths:
      - "devin_automation/**"
      - ".github/workflows/devin-automation.yml"
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - "devin_automation/**"
      - ".github/workflows/devin-automation.yml"

permissions:
  contents: read

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-devin-automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r devin_automation/requirements.txt pytest pytest-asyncio

      - name: Run pytest
        run: |
          pytest devin_automation -o asyncio_mode=auto
